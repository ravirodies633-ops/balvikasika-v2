name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Unzip and Prepare Project
      run: |
        unzip -q balvikasika-1.zip
        # Saari files check karke main directory me layein
        if [ -f "balvikasika-1/build.gradle.kts" ]; then
          cp -r balvikasika-1/* .
        fi
        # Wrapper ko execute permission dein
        chmod +x gradlew || true

    - name: Build Android Bundle (AAB)
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew bundleRelease --no-daemon --stacktrace
        else
          cd balvikasika-1 && chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace
        fi

    - name: Upload Signed/Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: balvikasika-release-bundle
        path: "**/build/outputs/bundle/release/*.aab"
        
