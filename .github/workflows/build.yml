name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Prepare Project
      run: |
        unzip -q balvikasika-1.zip
        if [ -d "balvikasika-1" ]; then
          cp -r balvikasika-1/* .
        fi
        gradle wrapper
        chmod +x gradlew

    - name: Build Android Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: ./gradlew bundleRelease --no-daemon --stacktrace

    - name: Upload Signed/Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: balvikasika-release-bundle
        path: "**/build/outputs/bundle/release/*.aab"
        
