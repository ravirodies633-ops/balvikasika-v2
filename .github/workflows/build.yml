name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Archive
      run: |
        unzip -q balvikasika-1.zip
        # Move files to root if unzipped inside a nested folder
        if [ -d "balvikasika-1" ]; then
          cp -r balvikasika-1/* .
        fi
        chmod +x gradlew

    - name: Build Android Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload Signed/Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: balvikasika-release-bundle
        path: app/build/outputs/bundle/release/*.aab
        
