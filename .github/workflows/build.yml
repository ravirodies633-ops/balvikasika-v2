name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Locate Gradle
      run: |
        unzip -q balvikasika-1.zip
        # Gradlew file dhoond kar root par lana
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          if [ "$PROJECT_DIR" != "." ]; then
            cp -rn "$PROJECT_DIR"/* .
          fi
        fi
        # Agar gradlew missing ho toh wrapper generate karna
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Android Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload Signed/Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: balvikasika-release-bundle
        path: app/build/outputs/bundle/release/*.aab
        
